name: JavaScript checks
on:
  push:
    branches: ["main", "feature/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run focused test files
        run: |
          set -e
          for file in tests/*.test.js; do
            echo "Running $file"
            node "$file"
          done
