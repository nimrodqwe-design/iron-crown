name: Lantern Run checks
on:
  push:
    branches: ["sidegame/**"]
  pull_request:
    branches: [sidegame/lantern-run]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check state and progress module syntax
        run: |
          node --check side-game/lantern-run/game-state.js
          node --check side-game/lantern-run/progress.js
      - name: Run deterministic state checks
        run: node side-game/lantern-run/game-state.test.js
      - name: Run progress storage checks
        run: node side-game/lantern-run/progress.test.js
      - name: Run UI contract checks
        run: node side-game/lantern-run/ui-contract.test.js
      - name: Run UI storage fallback checks
        run: node side-game/lantern-run/ui-storage-fallback.test.js
      - name: Run UI interaction checks
        run: node side-game/lantern-run/ui-interaction.test.js
      - name: Install Playwright Chromium for real-browser validation
        working-directory: side-game/lantern-run
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Run real Chromium smoke tests
        run: node side-game/lantern-run/browser-smoke.test.js
